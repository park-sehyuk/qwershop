<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>제품 등록 - 관리자 모드</title>
  <link rel="stylesheet" th:href="@{/admin/css/addpost.css}">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <style>
    .gallery-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; }
    .gallery-modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:550px; max-height:80%; background:white; z-index:1000; padding:20px; border-radius:12px; overflow-y:auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .gallery-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; margin-top: 15px; }
    .gallery-grid img { width:100%; height:110px; object-fit:cover; cursor:pointer; border-radius:6px; border:2px solid #eee; transition: all 0.2s ease; }
    .gallery-grid img:hover { border-color: #007bff; transform: translateY(-3px); }
    .image-input-item { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; padding: 10px; border: 1px solid #e0e0e0; border-radius: 8px; background:#fff; }
    .remove-btn { background:#ff4d4d; color:white; border:none; padding:6px 14px; border-radius:5px; cursor:pointer; font-size: 12px; }
  </style>
</head>
<body>
<div id="scale">
  <div class="left-side">
    <a th:href="@{/admin/userList}" class="text-border">
      <button class="userList"><div class="userimg"><img th:src="@{/admin/img/user-nonecolor.png}"></div><div>회원관리</div></button>
    </a>
    <a th:href="@{/admin/itemList}" class="text-border">
      <button class="postList"><div class="userimg2"><img th:src="@{/admin/img/menu-colorbar.png}"></div><div>게시물 관리</div></button>
    </a>
    <a th:href="@{/admin/category}" class="text-border">
      <button class="categoryList"><div class="userimg3"><img th:src="@{/admin/img/blogging.png}"></div><div>카테고리 리스트</div></button>
    </a>
    <a th:href="@{/admin/orderList}" class="text-border">
      <button class="orderList"><div class="userimg"><img th:src="@{/admin/img/blogging color.png}" alt=""></div><div>주문 리스트</div></button>
    </a>
  </div>

  <div class="top-right">
    <div class="right-Title">
      <p class="right-Title1">제품 등록</p>
      <p class="right-Title2">기존 모든 상세 타입을 유지하며 이미지를 선택합니다.</p>
    </div>

    <div class="form-wrapper">
      <div class="form-card">
        <form id="add-product-form">
          <div class="input-row">
            <div class="input-group">
              <label>상품명</label>
              <input type="text" id="itemName" required placeholder="상품명 입력">
            </div>
            <div class="input-group">
              <label>브랜드</label>
              <input type="text" id="itemBrand" required placeholder="브랜드명">
            </div>
          </div>

          <div class="input-row">
            <div class="input-group">
              <label>판매가 (원)</label>
              <input type="number" id="itemPrice" required placeholder="0">
            </div>
            <div class="input-group">
              <label>재고수량 (EA)</label>
              <input type="number" id="itemStock" required placeholder="0">
            </div>
          </div>

          <div class="input-row">
            <div class="input-group">
              <label>카테고리 설정</label>
              <select id="itemCategory">
                <option value="13">BEST</option>
                <option value="14">추천상품</option>
                <option value="15">이달의 상품</option>
              </select>
            </div>
            <div class="input-group">
              <label>상세 상품 타입</label>
              <select id="itemTypeSelect" required>
                <option value="">타입을 선택하세요</option>
                <optgroup label="공통">
                  <option value="16">New</option>
                  <option value="17">Best</option>
                </optgroup>
                <optgroup label="남성 (Men)">
                  <option value="18">남성상의-반팔</option>
                  <option value="19">남성상의-긴팔</option>
                  <option value="20">남성상의-맨투맨</option>
                  <option value="21">남성상의-니트</option>
                  <option value="22">남성상의-아우터</option>
                  <option value="23">남성하의-반바지</option>
                  <option value="24">남성하의-슬랙스</option>
                  <option value="25">남성하의-청바지</option>
                  <option value="26">남성하의-면바지</option>
                  <option value="27">남성하의-트랙팬츠</option>
                  <option value="28">남성신발-러닝화</option>
                  <option value="29">남성신발-스니커즈</option>
                  <option value="30">남성신발-구두</option>
                  <option value="31">남성신발-샌들</option>
                  <option value="32">남성신발-슬리퍼</option>
                  <option value="33">남성그 외-양말</option>
                  <option value="34">남성그 외-가방</option>
                  <option value="35">남성그 외-악세사리</option>
                  <option value="36">남성그 외-모자</option>
                  <option value="75">Men (전체)</option>
                  <option value="76">Men-상의 (전체)</option>
                  <option value="77">Men-하의 (전체)</option>
                  <option value="78">Men-신발 (전체)</option>
                  <option value="79">Men-그 외 (전체)</option>
                </optgroup>
                <optgroup label="여성 (Women)">
                  <option value="37">여성상의-반팔</option>
                  <option value="38">여성상의-긴팔</option>
                  <option value="39">여성상의-맨투맨</option>
                  <option value="40">여성상의-니트</option>
                  <option value="41">여성상의-아우터</option>
                  <option value="42">여성하의-반바지</option>
                  <option value="43">여성하의-슬랙스</option>
                  <option value="44">여성하의-청바지</option>
                  <option value="45">여성하의-면바지</option>
                  <option value="46">여성하의-트랙팬츠</option>
                  <option value="47">여성신발-러닝화</option>
                  <option value="48">여성신발-스니커즈</option>
                  <option value="49">여성신발-구두</option>
                  <option value="50">여성신발-샌들</option>
                  <option value="51">여성신발-슬리퍼</option>
                  <option value="52">여성그 외-양말</option>
                  <option value="53">여성그 외-가방</option>
                  <option value="54">여성그 외-악세사리</option>
                  <option value="55">여성그 외-모자</option>
                  <option value="80">Women (전체)</option>
                  <option value="81">Women-상의 (전체)</option>
                  <option value="82">Women-하의 (전체)</option>
                  <option value="83">Women-신발 (전체)</option>
                  <option value="84">Women-그 외 (전체)</option>
                </optgroup>
                <optgroup label="아동 (Kids)">
                  <option value="56">아동상의-반팔</option>
                  <option value="57">아동상의-긴팔</option>
                  <option value="58">아동상의-맨투맨</option>
                  <option value="59">아동상의-니트</option>
                  <option value="60">아동상의-아우터</option>
                  <option value="61">아동하의-반바지</option>
                  <option value="62">아동하의-슬랙스</option>
                  <option value="63">아동하의-청바지</option>
                  <option value="64">아동하의-면바지</option>
                  <option value="65">아동하의-트랙팬츠</option>
                  <option value="66">아동신발-러닝화</option>
                  <option value="67">아동신발-스니커즈</option>
                  <option value="68">아동신발-구두</option>
                  <option value="69">아동신발-샌들</option>
                  <option value="70">아동신발-슬리퍼</option>
                  <option value="71">아동그 외-양말</option>
                  <option value="72">아동그 외-가방</option>
                  <option value="73">아동그 외-악세사리</option>
                  <option value="74">아동그 외-모자</option>
                  <option value="85">Kids (전체)</option>
                  <option value="86">Kids-상의 (전체)</option>
                  <option value="87">Kids-하의 (전체)</option>
                  <option value="88">Kids-신발 (전체)</option>
                  <option value="89">Kids-그 외 (전체)</option>
                </optgroup>
              </select>
            </div>
          </div>

          <div class="image-section">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">선택된 이미지 리스트</label>
            <div id="image-input-container" style="min-height: 40px; border-top: 1px solid #eee; padding-top: 10px;">
            </div>
            <button type="button" id="open-gallery-btn" class="img-add-btn"
                    style="width: 100%; padding: 14px; background: #fff; border: 2px dashed #007bff; color: #007bff; cursor: pointer; margin-top: 10px; border-radius: 8px; font-weight: bold;">
              + 갤러리에서 상품 이미지 선택하기
            </button>
          </div>

          <div class="submit-area" style="margin-top: 30px;">
            <button type="submit" class="submit-btn">등록하기</button>
            <button type="button" class="cancel-btn" onclick="history.back()">돌아가기</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="gallery-overlay" class="gallery-overlay"></div>
<div id="gallery-modal" class="gallery-modal">
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px;">
    <h4 style="margin: 0;">저장소 이미지 선택</h4>
    <button type="button" id="close-gallery-btn" style="background:none; border:none; font-size:20px; cursor:pointer;">&times;</button>
  </div>
  <div id="gallery-grid" class="gallery-grid"></div>
</div>

<script th:src="@{/admin/js/addpost.js}"></script>
</body>
</html>
