<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시물 관리 - 관리자 모드</title>
    <link rel="stylesheet" th:href="@{/admin/css/post.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <style>
        [id^="preview-container-"]::-webkit-scrollbar { height: 6px; }
        [id^="preview-container-"]::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        .category-data-table td { vertical-align: middle; }

        /* 갤러리 모달 스타일 추가 */
        .gallery-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; }
        .gallery-modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:550px; max-height:80%; background:white; z-index:1000; padding:20px; border-radius:12px; overflow-y:auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .gallery-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; margin-top: 15px; }
        .gallery-grid img { width:100%; height:110px; object-fit:cover; cursor:pointer; border-radius:6px; border:2px solid #eee; transition: 0.2s; }
        .gallery-grid img:hover { border-color: #007bff; transform: translateY(-3px); }
    </style>
</head>
<body>
<div id="scale">
    <div class="left-side">
        <a th:href="@{/admin/userList}" class="text-border">
            <button class="userList"><div class="userimg"><img th:src="@{/admin/img/user-nonecolor.png}"></div><div>회원관리</div></button>
        </a>
        <a th:href="@{/admin/itemList}" class="text-border">
            <button class="postList"><div class="userimg2"><img th:src="@{/admin/img/menu-colorbar.png}"></div><div>게시물 관리</div></button>
        </a>
        <a th:href="@{/admin/category}" class="text-border">
            <button class="categoryList"><div class="userimg3"><img th:src="@{/admin/img/blogging.png}"></div><div>카테고리 리스트</div></button>
        </a>
        <a th:href="@{/admin/orderList}" class="text-border">
            <button class="orderList"><div class="userimg"><img th:src="@{/admin/img/blogging color.png}"></div><div>주문 리스트</div></button>
        </a>
    </div>

    <div class="top-right">
        <div class="right-side">
            <div class="right-Title">
                <p class="right-Title1">게시물 관리</p>
                <p class="right-Title2">등록된 상품 정보를 리스트에서 즉시 수정하거나 삭제할 수 있습니다.</p>
            </div>
            <div class="button-tap">
                <button class="add-category" onclick="location.href='/admin/addpost'">제품 추가</button>
            </div>
        </div>

        <div class="table-container">
            <table class="category-data-table">
                <thead>
                <tr>
                    <th style="width: 250px;">대표이미지 / 파일 관리</th>
                    <th>상품명 / 브랜드</th>
                    <th style="width: 120px;">판매가</th>
                    <th style="width: 180px;">카테고리 / 타입</th>
                    <th style="width: 80px;">재고</th>
                    <th style="width: 120px;">등록일</th>
                    <th style="width: 150px;">관리</th>
                </tr>
                </thead>
                <tbody id="product-list-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="gallery-overlay" class="gallery-overlay"></div>
<div id="gallery-modal" class="gallery-modal">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px;">
        <h4 style="margin: 0;">수정용 이미지 선택 (posting)</h4>
        <button type="button" onclick="closeGallery()" style="background:none; border:none; font-size:20px; cursor:pointer;">&times;</button>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
</div>

<script th:src="@{/admin/js/post.js}"></script>
</body>
</html>
