<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultreq.net.nz/thymleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <meta charset="UTF-8">
  <title>나의 주문 내역</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/user/css/base.css}">
  <link rel="stylesheet" th:href="@{/user/css/order/orderList.css}">
</head>
<body>

<div class="container order-container" layout:fragment="content">
  <div class="section">
    <h2>📦 주문 내역</h2>
    <p class="text-muted">최근 주문하신 내역을 확인하실 수 있습니다.</p>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
      <tr>
        <th>주문일자</th>
        <th>상품 정보</th>
        <th>총 결제금액</th>
        <th>주문 상태</th>
        <th>관리</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="order : ${orders}">
        <td class="order-date" th:text="${order.orderDate}">2026-01-12</td>
        <td class="order-item">
          <span class="fw-bold" th:text="${order.itemNm}">상품명</span>
        </td>
        <td class="order-price">
          <span th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')}">30,000</span>원
        </td>
        <td>
          <span class="badge rounded-pill bg-primary" th:text="${order.orderStatus}">결제완료</span>
        </td>
        <td>
          <a class="btn btn-sm btn-outline-secondary"
             th:href="@{/orderDetail/{id}(id=${order.orderId})}">상세보기</a>
        </td>
      </tr>

      <tr th:if="${#lists.isEmpty(orders)}">
        <td colspan="5" class="text-center py-5 text-muted">
          주문 내역이 존재하지 않습니다.
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="text-center mt-4">
    <a href="/" class="btn btn-dark px-4">메인으로 돌아가기</a>
  </div>
</div>

<script th:src="@{/user/js/order/orderList.js}"></script>
</body>
</html>
