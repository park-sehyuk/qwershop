<!DOCTYPE html>
<html lang="ko"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layouts/layout}">

<head>
	<meta charset="UTF-8" />
	<title>장바구니 - QWER</title>
	<th:block layout:fragment="css">
		<link rel="stylesheet" th:href="@{/user/css/production/cart.css}" />
	</th:block>
</head>

<body>
<div layout:fragment="content">
	<main class="cart-container">
		<h1 class="cart-title">장바구니</h1>

		<section class="cart-box">
			<table class="cart-table">
				<thead>
				<tr>
					<th class="col-item">상품</th>
					<th class="col-price">가격</th>
					<th class="col-qty">수량</th>
					<th class="col-sub">합계</th>
					<th class="col-act">삭제</th>
				</tr>
				</thead>
				<tbody id="cart-items">
				<tr th:each="item : ${cartItems}">
					<td class="col-item">
						<div class="item-info">
							<img class="item-thumb" th:src="${item.imgUrl}" th:alt="${item.itemNm}" />
							<div class="item-meta">
								<div class="item-title" th:text="${item.itemNm}">상품명</div>
								<div class="item-option" th:text="${item.selectedColor} + ' / ' + ${item.selectedSize}">옵션</div>
							</div>
						</div>
					</td>
					<td class="col-price"><span th:text="${item.price}">0</span>원</td>
					<td class="col-qty">
						<div class="qty-controls">
							<input type="number" class="qty-input" th:value="${item.count}" min="1" />
						</div>
					</td>
					<td class="col-sub"><span th:text="${item.price * item.count}">0</span>원</td>
					<td class="col-act">
						<button class="remove-item btn" th:onclick="'deleteCartItem(' + ${item.cartId} + ')'">삭제</button>
					</td>
				</tr>
				<tr th:if="${#lists.isEmpty(cartItems)}">
					<td colspan="5" style="text-align: center; padding: 50px;">장바구니가 비어 있습니다.</td>
				</tr>
				</tbody>
			</table>

			<div class="cart-actions">
				<button id="clear-cart" class="btn btn-secondary">전체삭제</button>
				<div class="cart-summary">
					<div>총 상품금액: <span id="total-price" th:text="${totalPrice}">0</span>원</div>
					<button id="checkout" class="btn btn-primary" onclick="location.href='/order'">주문하기</button>
				</div>
			</div>
		</section>
	</main>
</div>

<th:block layout:fragment="script">
	<script th:src="@{/user/js/production/cart.js}"></script>
	<script th:src="@{/user/js/common.js}"></script>
</th:block>
</body>
</html>
