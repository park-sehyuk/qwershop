<!DOCTYPE html>
<html lang="ko"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layouts/layout}">

<head>
	<meta charset="UTF-8" />
	<title>장바구니 - QWER SHOP</title>
	<link rel="stylesheet" th:href="@{/user/css/production/cart.css}" />
	<style>
		/* 페이지 특화 스타일 (필요시 cart.css에 옮기세요) */
		.cart-container { max-width: 1100px; margin: 50px auto; padding: 0 20px; }
		.cart-title { font-size: 28px; font-weight: 800; margin-bottom: 30px; border-bottom: 2px solid #222; padding-bottom: 15px; }

		.cart-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
		.cart-table th { padding: 15px; border-bottom: 1px solid #eee; font-size: 14px; color: #666; }
		.cart-table td { padding: 20px 15px; border-bottom: 1px solid #f9f9f9; vertical-align: middle; }

		.item-info { display: flex; align-items: center; gap: 20px; }
		.item-thumb { width: 100px; height: 120px; object-fit: cover; border-radius: 4px; background: #f4f4f4; }
		.item-title { font-weight: 700; font-size: 16px; margin-bottom: 5px; color: #222; }

		/* 옵션 뱃지 스타일 */
		.option-tag { font-size: 12px; color: #888; background: #f0f0f0; padding: 3px 8px; border-radius: 12px; display: inline-block; margin-top: 5px; }

		.qty-input { width: 50px; padding: 5px; text-align: center; border: 1px solid #ddd; border-radius: 4px; }
		.price-text { font-weight: 700; color: #222; }
		.btn-remove { background: none; border: 1px solid #ddd; color: #999; padding: 5px 10px; cursor: pointer; font-size: 12px; transition: 0.2s; }
		.btn-remove:hover { border-color: #f33; color: #f33; }

		/* 하단 요약 영역 */
		.cart-footer { display: flex; justify-content: space-between; align-items: flex-start; background: #fcfcfc; padding: 30px; border-radius: 8px; border: 1px solid #eee; }
		.total-info { text-align: right; }
		.total-info p { margin-bottom: 10px; color: #666; }
		.total-price { font-size: 24px; font-weight: 800; color: #f33; }

		.action-btns { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
		.btn-order { background: #222; color: #fff; padding: 15px 50px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
		.btn-clear { background: #fff; border: 1px solid #ccc; padding: 15px 30px; cursor: pointer; }
	</style>
</head>

<body>
<div layout:fragment="content">
	<main class="cart-container">
		<h1 class="cart-title">장바구니</h1>

		<section class="cart-box">
			<table class="cart-table">
				<thead>
				<tr>
					<th class="col-item">상품정보</th>
					<th class="col-price">판매가</th>
					<th class="col-qty">수량</th>
					<th class="col-sub">합계</th>
					<th class="col-act">선택</th>
				</tr>
				</thead>
				<tbody id="cart-items">
				<tr th:each="item : ${cartItems}">
					<td class="col-item">
						<div class="item-info">
							<img class="item-thumb" th:src="${item.imgUrl}" th:alt="${item.itemNm}" />
							<div class="item-meta">
								<div class="item-title" th:text="${item.itemNm}">상품명</div>
								<div class="option-tag">
									Color: <span th:text="${item.selectedColor}">색상</span>
									/ Size: <span th:text="${item.selectedSize}">사이즈</span>
								</div>
							</div>
						</div>
					</td>
					<td class="col-price text-center">
						<span class="price-text" th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')}">0</span>원
					</td>
					<td class="col-qty text-center">
						<input type="number" class="qty-input" th:value="${item.count}" min="1" />
					</td>
					<td class="col-sub text-center">
						<span class="price-text" th:text="${#numbers.formatInteger(item.price * item.count, 0, 'COMMA')}">0</span>원
					</td>
					<td class="col-act text-center">
						<button class="btn-remove" th:onclick="'deleteCartItem(' + ${item.cartId} + ')'">삭제</button>
					</td>
				</tr>

				<tr th:if="${#lists.isEmpty(cartItems)}">
					<td colspan="5" style="text-align: center; padding: 100px 0; color: #999;">
						<i class="fas fa-shopping-cart" style="font-size: 40px; margin-bottom: 20px; display: block;"></i>
						장바구니가 비어 있습니다.
					</td>
				</tr>
				</tbody>
			</table>

			<div class="cart-footer">
				<div class="total-price-area">
					<span class="total-label">총 결제 금액</span>
					<span class="total-amount">
            <span id="total-price" th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')}">0</span>원
        </span>
				</div>

				<div class="button-area">
					<button type="button" class="btn-order" onclick="location.href='/order'">주문하기</button>
				</div>
			</div>
		</section>
	</main>
</div>

<th:block layout:fragment="script">
	<script th:src="@{/user/js/production/cart.js}"></script>
	<script th:src="@{/user/js/common.js}"></script>
</th:block>
</body>
</html>
