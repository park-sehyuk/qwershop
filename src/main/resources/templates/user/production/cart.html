<!DOCTYPE html>
<html lang="ko"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layouts/layout}">

<head>
	<meta charset="UTF-8" />
	<title>장바구니 - QWER SHOP</title>
	<meta name="_csrf" th:content="${_csrf.token}"/>
	<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
	<link rel="stylesheet" th:href="@{/user/css/production/cart.css}" />
	<script src="https://cdn.iamport.kr/v1/iamport.js"></script>
</head>

<body>
<div layout:fragment="content">
	<main class="cart-container">
		<h1 class="cart-title">장바구니</h1>

		<section class="cart-box">
			<table class="cart-table">
				<thead>
				<tr>
					<th class="col-item">상품정보</th>
					<th class="col-price">판매가</th>
					<th class="col-qty">수량</th>
					<th class="col-sub">합계</th>
					<th class="col-act">선택</th>
				</tr>
				</thead>
				<tbody id="cart-items">
				<tr th:each="item : ${cartItems}">
					<td class="col-item">
						<div class="item-info">
							<img class="item-thumb" th:src="${item.imgUrl}" th:alt="${item.itemNm}" />
							<div class="item-meta">
								<div class="item-title" th:text="${item.itemNm}">상품명</div>
								<div class="option-tag">
									Color: <span th:text="${item.selectedColor}">색상</span>
									/ Size: <span th:text="${item.selectedSize}">사이즈</span>
								</div>
							</div>
						</div>
					</td>
					<td class="col-price text-center">
						<span class="price-text" th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')}">0</span>원
					</td>
					<td class="col-qty text-center">
						<input type="number" class="qty-input"
							   th:value="${item.count}" min="1"
							   th:data-id="${item.cartId}"
							   onchange="changeCount(this)" />
					</td>
					<td class="col-sub text-center">
						<span class="price-text" th:text="${#numbers.formatInteger(item.price * item.count, 0, 'COMMA')}">0</span>원
					</td>
					<td class="col-act text-center">
						<button type="button" class="btn-remove"
								th:data-id="${item.cartId}"
								onclick="deleteItem(this)">삭제</button>
					</td>
				</tr>

				<tr th:if="${#lists.isEmpty(cartItems)}">
					<td colspan="5" style="text-align: center; padding: 100px 0; color: #999;">
						장바구니가 비어 있습니다.
					</td>
				</tr>
				</tbody>
			</table>

			<div class="cart-footer">
				<div class="total-price-area">
					<span class="total-label">총 결제 금액</span>
					<span class="total-amount">
                        <span id="total-price" th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')}">0</span>원
                    </span>
				</div>
				<div class="button-area">
					<button type="button" class="btn-order" onclick="order()">주문하기</button>
				</div>
			</div>
		</section>
	</main>
</div>

<th:block layout:fragment="script">
	<script th:inline="javascript">
		// 결제 함수
		function order() {
			console.log("결제 시작...");

			if (!window.IMP) {
				alert("결제 라이브러리가 로드되지 않았습니다.");
				return;
			}

			const IMP = window.IMP;
			IMP.init("imp45123642");

			const cartRows = document.querySelectorAll("#cart-items tr");
			if (cartRows.length === 0 || cartRows[0].querySelector(".item-title") === null) {
				alert("결제할 상품이 없습니다.");
				return;
			}

			const firstItemName = cartRows[0].querySelector(".item-title").innerText;
			const totalCount = cartRows.length;
			const paymentName = totalCount > 1 ? firstItemName + " 외 " + (totalCount - 1) + "건" : firstItemName;
			const totalAmount = parseInt(document.getElementById("total-price").innerText.replace(/,/g, ''));

			IMP.request_pay({
				pg: "kakaopay.TC0ONETIME",
				pay_method: "card",
				merchant_uid: "ORD_" + new Date().getTime(),
				name: paymentName,
				amount: totalAmount,
				buyer_name: "구매자",
				buyer_tel: "010-0000-0000"
			}, function (rsp) {
				if (rsp.success) {
					const token = document.querySelector('meta[name="_csrf"]').content;
					const header = document.querySelector('meta[name="_csrf_header"]').content;

					fetch("/order/payment-complete", {
						method: "POST",
						headers: { "Content-Type": "application/json", [header]: token },
						body: JSON.stringify({
							imp_uid: rsp.imp_uid,
							merchant_uid: rsp.merchant_uid,
							paid_amount: rsp.paid_amount,
							status: "paid"
						})
					}).then(res => {
						if (res.ok) {
							alert("주문이 완료되었습니다.");
							location.href = "/";
						}
					});
				} else {
					alert("결제 실패: " + rsp.error_msg);
				}
			});
		}

		// 삭제 함수
		window.deleteItem = function(obj) {
			const cartId = obj.getAttribute('data-id');
			const token = document.querySelector('meta[name="_csrf"]').content;
			const header = document.querySelector('meta[name="_csrf_header"]').content;

			if(!confirm("삭제하시겠습니까?")) return;

			fetch("/cartItem/" + cartId, {
				method: 'DELETE',
				headers: { 'X-Requested-With': 'XMLHttpRequest', [header]: token }
			}).then(res => {
				if (res.ok) location.reload();
			});
		};

		// 수량 변경 함수
		window.changeCount = function(obj) {
			const count = obj.value;
			const cartId = obj.getAttribute('data-id');
			const token = document.querySelector('meta[name="_csrf"]').content;
			const header = document.querySelector('meta[name="_csrf_header"]').content;

			fetch("/cartItem/" + cartId + "?count=" + count, {
				method: 'PATCH',
				headers: { 'X-Requested-With': 'XMLHttpRequest', [header]: token }
			}).then(res => {
				if (res.ok) location.reload();
			});
		};

	</script>
</th:block>
</body>
</html>
