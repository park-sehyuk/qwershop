<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultreq.net.nz/thymleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link rel="stylesheet" th:href="@{/user/css/base.css}" />
  <link rel="stylesheet" th:href="@{/user/css/production/itemList.css}" />
</head>

<div id="itemList" layout:fragment="content">
  <div class="container">
    <div class="main-banner">
      <img th:src="@{/user/imges/itemlistmain.jpg}" alt="Main Banner Image" />
    </div>

    <div class="filter-bar">
      <div class="item-count">
        <span id="total-items" th:text="${#lists.size(itemList)} + ' Item'">0 Item</span>
      </div>

      <div class="sort-container">
        <button class="sort-button">
          <span id="sort-text" th:text="${currentSort == 'price_desc' ? '높은가격순' : (currentSort == 'price_asc' ? '낮은가격순' : '최신순')}">정렬 기준</span>
          <span class="arrow">▼</span>
        </button>

        <div class="sort-dropdown">
          <a th:href="@{/itemList(type=${selectedType}, sort='latest')}">최신순</a>
          <a th:href="@{/itemList(type=${selectedType}, sort='price_desc')}">높은가격순</a>
          <a th:href="@{/itemList(type=${selectedType}, sort='price_asc')}">낮은가격순</a>
        </div>
      </div>
    </div>

    <main id="product-grid" class="product-grid">
      <th:block th:each="item : ${itemList}">
        <div class="product-item">
          <div class="imges-wrapper">
            <a th:href="'/detail?itemId=' + ${item.itemId}">
              <img th:src="${item.itemUrl}" alt="상품 이미지">
            </a>
          </div>

          <div class="info">
            <div class="brand" th:text="${item.itemBrand}">브랜드</div>

            <a th:href="@{/item/detail(itemId=${item.itemId})}">
              <div class="name" th:text="${item.itemName}">상품명</div>
            </a>

            <div class="price">
              <span th:text="${#numbers.formatInteger(item.itemPrice, 3, 'COMMA')}">0</span>원
            </div>
          </div>
        </div>
      </th:block>
    </main>

    <nav class="pagination-container">
      <ul id="pagination" class="pagination"></ul>
    </nav>
  </div>

  <script th:src="@{/user/js/production/itemLIst.js}"></script>
  <script th:src="@{/user/js/common.js}"></script>
</div>
</html>
