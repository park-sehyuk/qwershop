<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultreq.net.nz/thymleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}">

<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
    <link rel="stylesheet" th:href="@{/user/css/base.css}">
    <link rel="stylesheet" th:href="@{/user/css/production/detail.css}">
    <style>
        /* 별점 및 탭 보정 스타일만 추가 */
        .star-rating { display: flex; flex-direction: row-reverse; justify-content: flex-start; gap: 5px; margin-bottom: 15px; }
        .star-rating input { display: none; }
        .star-rating label { cursor: pointer; font-size: 30px; color: #ddd; transition: 0.2s; }
        .star-rating input:checked ~ label, .star-rating label:hover, .star-rating label:hover ~ label { color: #f39c12; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block !important; }
        .size-table { width: 100%; border-collapse: collapse; margin-top: 15px; border-top: 2px solid #222; }
        .size-table th, .size-table td { border-bottom: 1px solid #eee; padding: 12px; text-align: center; font-size: 14px; }
        .size-table th { background: #f9f9f9; font-weight: 600; }
    </style>
</head>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        var loginUser = [[${#authentication.name}]];

        $(document).ready(function(){
            calculateToalPrice();
            loadReviews(); // 리뷰 초기 로드

            $("#count").on("input change", function(){
                calculateToalPrice();
            });
        });

        function calculateToalPrice(){
            var count = $("#count").val();
            var price = $("#price").val();
            var totalPrice = price * count;
            $("#totalPrice").html(totalPrice.toLocaleString() + '원');
        }

        // --- 원본 장바구니/결제 로직 보존 ---
        async function sendRequest(url, paramData, successMsg) {
            if(!paramData.color) { alert("색상을 선택해주세요."); $("#colorSelect").focus(); return; }
            if(!paramData.size){ alert("사이즈를 선택해주세요."); $("#sizeSelect").focus(); return; }

            var token = $("meta[name='_csrf']").attr("content");
            var header = $("meta[name='_csrf_header']").attr("content");

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                        [header]: token
                    },
                    body: JSON.stringify(paramData),
                    cache: 'no-cache'
                });

                if (response.status === 401) {
                    alert('로그인이 필요한 서비스입니다.');
                    location.href = '/user/login';
                    return;
                }

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText);
                }

                alert(successMsg);
                location.href = "/cart";
            } catch (error) {
                alert("실패: " + error.message);
            }
        }

        function order() {
            if (!window.IMP) { alert("결제 라이브러리가 로드되지 않았습니다."); return; }
            const IMP = window.IMP;
            IMP.init("imp45123642"); // 가맹점 식별코드

            const color = $("#colorSelect").val();
            const size = $("#sizeSelect").val();
            const itemId = $("#itemId").val();
            const count = $("#count").val();
            const price = $("#price").val();
            const totalPrice = parseInt(price) * parseInt(count);

            if(!color || !size) { alert("옵션을 선택해주세요."); return; }

            IMP.request_pay({
                pg: "kakaopay.TC0ONETIME",
                pay_method: "card",
                merchant_uid: "ORD_" + new Date().getTime(),
                name: $(".product-title").text(),
                amount: totalPrice,
                buyer_name: "구매자", // 실제로는 로그인 유저 정보 연동 권장
                buyer_tel: "010-0000-0000"
            }, function (rsp) {
                if (rsp.success) {
                    // 결제 성공 시 서버로 주문 정보 전송
                    saveDirectOrder(itemId, count, color, size, totalPrice);
                } else {
                    alert("결제 실패: " + rsp.error_msg);
                }
            });
        }

        // 결제 성공 후 DB 저장을 위한 함수
        function saveDirectOrder(itemId, count, color, size, totalPrice) {
            var token = $("meta[name='_csrf']").attr("content");
            var header = $("meta[name='_csrf_header']").attr("content");

            // DTO 필드명과 일치하게 구성
            var paramData = {
                itemId: parseInt(itemId),
                count: parseInt(count),
                selectedColor: color,
                selectedSize: size,
                totalPrice: parseInt(totalPrice),
                deliveryAddr: "기본 배송지 정보" // 필요시 주소 입력값 연동
            };

            $.ajax({
                url: "/order/direct",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(paramData),
                beforeSend: function(xhr) { xhr.setRequestHeader(header, token); },
                success: function(orderId) {
                    alert("주문이 완료되었습니다!");
                    location.href = "/orderList";
                },
                error: function(xhr) {
                    alert("처리 중 오류가 발생했습니다: " + xhr.responseText);
                }
            });
        }

        function addCart() {
            var paramData = {
                itemId: $("#itemId").val(),
                count: $("#count").val(),
                color: $("#colorSelect").val(),
                size: $("#sizeSelect").val()
            };
            sendRequest("/cart", paramData, "장바구니에 추가되었습니다.");
        }

        // --- 리뷰 기능 추가 ---
        function loadReviews() {
            var itemId = $("#itemId").val();
            $.ajax({
                url: "/reviews/" + itemId,
                type: "GET",
                success: function(reviews) {
                    var html = "";
                    if(reviews && reviews.length > 0) {
                        reviews.forEach(function(r) {
                            var stars = "★".repeat(r.star) + "☆".repeat(5 - r.star);
                            html += `<div style="padding:15px; border-bottom:1px solid #eee; position:relative; background:#fff;">
                                        <div style="color:#f39c12; margin-bottom:5px;">${stars}</div>
                                        <strong>${r.createdBy}</strong> <small style="color:#888;">${r.regTime}</small>
                                        <p style="margin:5px 0 0 0;">${r.content}</p>`;
                            if(loginUser === r.createdBy) {
                                html += `<button onclick="deleteReview(${r.reviewId})" style="position:absolute; right:15px; top:15px; color:red; border:none; background:none; cursor:pointer;">삭제</button>`;
                            }
                            html += `</div>`;
                        });
                    } else {
                        html = "<p style='text-align:center; padding:30px; color:#999;'>등록된 후기가 없습니다.</p>";
                    }
                    $("#reviewList").html(html);
                }
            });
        }

        function saveReview() {
            var content = $("#reviewContent").val();
            var starValue = $("input[name='rating']:checked").val();
            if(!content) { alert("내용을 입력하세요."); return; }
            var token = $("meta[name='_csrf']").attr("content");
            var header = $("meta[name='_csrf_header']").attr("content");
            $.ajax({
                url: "/review/new",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ itemId: $("#itemId").val(), content: content, star: starValue }),
                beforeSend: function(xhr) { xhr.setRequestHeader(header, token); },
                success: function() {
                    alert("등록되었습니다.");
                    $("#reviewContent").val("");
                    loadReviews();
                },
                error: function() { alert("오류가 발생했습니다."); }
            });
        }

        function deleteReview(reviewId) {
            if(!confirm("삭제하시겠습니까?")) return;
            var token = $("meta[name='_csrf']").attr("content");
            var header = $("meta[name='_csrf_header']").attr("content");
            $.ajax({
                url: "/review/delete/" + reviewId,
                type: "POST",
                beforeSend: function(xhr) { xhr.setRequestHeader(header, token); },
                success: function() { loadReviews(); }
            });
        }
    </script>
</th:block>

<div id="detail" layout:fragment="content">
    <div id="big-Title">
        <div class="top-Side">
            <div class="left-column">
                <div class="left-image" id="main-product-image">
                    <img th:src="${item.itemUrl}" th:alt="${item.itemName}" style="width:100%; height:100%; object-fit:cover;">
                </div>

                <div class="left-tabs">
                    <div class="tabs">
                        <button class="tab active" data-tab="info">정보</button>
                        <button class="tab" data-tab="size">사이즈</button>
                        <button class="tab" data-tab="recommend">추천</button>
                        <button class="tab" data-tab="review">후기</button>
                    </div>
                    <div class="tab-panels">
                        <div class="tab-panel active" id="info">
                            <div class="info-accordion">
                                <div class="acc-item">
                                    <button class="acc-head open">상품상세</button>
                                    <div class="acc-body open">
                                        <ul>
                                            <li><strong>브랜드:</strong> <span th:text="${item.itemBrand}"></span></li>
                                            <li><strong>가격:</strong> <span th:text="${#numbers.formatInteger(item.itemPrice, 0, 'COMMA')} + '원'"></span></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="tab-panel" id="size">
                            <div class="size-guide">
                                <table class="size-table">
                                    <thead><tr><th>사이즈</th><th>총장</th><th>어깨너비</th><th>가슴단면</th></tr></thead>
                                    <tbody>
                                    <tr><td>S</td><td>68</td><td>45</td><td>52</td></tr>
                                    <tr><td>M</td><td>70</td><td>47</td><td>54</td></tr>
                                    <tr><td>L</td><td>72</td><td>49</td><td>56</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="tab-panel" id="recommend">
                            <div style="padding:15px;">
                                <p><strong>MD 추천 코디</strong></p>
                                <p th:text="${item.itemName} + ' 상품은 슬랙스와 잘 어울립니다.'"></p>
                            </div>
                        </div>

                        <div class="tab-panel" id="review">
                            <div style="padding:20px; border:1px solid #eee; margin-bottom:20px; background:#fcfcfc;">
                                <div class="star-rating">
                                    <input type="radio" id="5-stars" name="rating" value="5" /><label for="5-stars">★</label>
                                    <input type="radio" id="4-stars" name="rating" value="4" /><label for="4-stars">★</label>
                                    <input type="radio" id="3-stars" name="rating" value="3" checked /><label for="3-stars">★</label>
                                    <input type="radio" id="2-stars" name="rating" value="2" /><label for="2-stars">★</label>
                                    <input type="radio" id="1-star" name="rating" value="1" /><label for="1-star">★</label>
                                </div>
                                <div style="display:flex; gap:10px;">
                                    <input type="text" id="reviewContent" style="flex:1; padding:12px; border:1px solid #ddd;" placeholder="후기를 남겨주세요.">
                                    <button onclick="saveReview()" style="padding:0 25px; background:#222; color:#fff; border:none; cursor:pointer;">등록</button>
                                </div>
                            </div>
                            <div id="reviewList"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-Side">
                <input type="hidden" id="itemId" th:value="${item.itemId}">
                <input type="hidden" id="price" th:value="${item.itemPrice}">

                <div class="product-header" style="margin-bottom: 20px; border-bottom: 1px solid #f4f4f4; padding-bottom: 15px;">
                    <p class="brand-name" th:text="${item.itemBrand}" style="font-size: 14px; color: #888; font-weight: 600; text-decoration: underline;">브랜드</p>
                    <h2 class="product-title" th:text="${item.itemName}" style="font-size: 22px; font-weight: 700; color: #222;">상품명</h2>
                </div>

                <p class="price" style="font-size: 24px; font-weight: 800; color: #333; margin-bottom: 20px;">
                    <span th:text="${#numbers.formatInteger(item.itemPrice, 0, 'COMMA')}">0</span>원
                </p>

                <div class="quantity-select">
                    <label style="font-weight: bold; font-size: 14px;">수량 : </label>
                    <input type="number" id="count" value="1" min="1" style="width: 60px; padding: 5px;">
                </div>

                <div class="color-select" style="margin-top: 20px;">
                    <p style="font-weight: bold; margin-bottom: 8px;">색상 선택</p>
                    <select id="colorSelect" class="color-dropdown" required style="width: 100%; padding: 10px;">
                        <option value="" disabled selected>색상을 선택해주세요</option>
                        <th:block th:each="color : ${colors}">
                            <option th:value="${color.codeName}" th:text="${color.codeName}"></option>
                        </th:block>
                    </select>
                </div>

                <div class="size-select" style="margin-top: 20px; margin-bottom: 20px;">
                    <p style="font-weight: bold; margin-bottom: 8px;">사이즈 선택</p>
                    <select id="sizeSelect" class="size-dropdown" required style="width: 100%; padding: 10px;">
                        <option value="" disabled selected>사이즈를 선택해주세요</option>
                        <th:block th:each="size : ${sizes}">
                            <option th:value="${size.codeName}" th:text="${size.codeName}"></option>
                        </th:block>
                    </select>
                </div>

                <div class="total-price-area" style="margin-bottom: 25px; padding: 15px; background: #f9f9f9; display: flex; justify-content: space-between;">
                    <strong>총 결제 금액</strong>
                    <span id="totalPrice" style="font-size: 22px; font-weight: 800; color: #f33;">0원</span>
                </div>

                <div class="Buy-Cart" style="display: flex; gap: 10px;">
                    <button type="button" class="Buy" onclick="addCart()">장바구니</button>
                    <button type="button" class="Cart" onclick="order()">바로 구매</button>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/user/js/production/detail.js}"></script>
</div>
</html>
