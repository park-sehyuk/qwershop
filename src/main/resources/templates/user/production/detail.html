<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultreq.net.nz/thymleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link rel="stylesheet" th:href="@{/user/css/base.css}">
  <link rel="stylesheet" th:href="@{/user/css/production/detail.css}">
</head>

<div id="detail" layout:fragment="content">
<div id="big-Title">

  <div class="top-Side">
    <div class="left-column">
      <div class="left-image" id="main-product-image"></div>
      <div class="left-tabs">
        <div class="tabs">
          <button class="tab active" data-tab="info">정보</button>
          <button class="tab" data-tab="size">사이즈</button>
          <button class="tab" data-tab="recommend">추천</button>
          <button class="tab" data-tab="review">후기</button>
        </div>
        <div class="tab-panels">
          <div class="tab-panel active" id="info">
            <p>여기에 제품 정보가 표시됩니다.</p>
          </div>
          <div class="tab-panel" id="size">
            <p>사이즈 정보가 표시됩니다.</p>
          </div>
          <div class="tab-panel" id="recommend">
            <p>추천 제품 목록이 표시됩니다.</p>
          </div>
          <div class="tab-panel" id="review">
            <p>후기 목록이 표시됩니다.</p>
          </div>
        </div>
      </div>
    </div>
    <div class="right-Side">
      <p class="text-Title">즉시 구매가</p>
      <p class="price" id="product-price">80,000원</p>
      <p class="brand-name" id="product-name-english">Stussy World Tour T-Shirt Black 2024,2025</p>
      <p class="brand-hagul" id="product-name-korean">스투시 월드투어 티셔츠 블랙 2024,2025</p>
      <div class="Rating">
        <p class="icon"></p>
        <p class="number">4.8</p>
        <p class="review">리뷰 834</p>
      </div>
      <div class="size-Bar">
        <p class="sizeText">모든사이즈</p>
        <button class="size-icon"></button>
      </div>
      <div class="size-options" style="display: none;">
        <ul>
          <li><button data-size="S">S</button></li>
          <li><button data-size="M">M</button></li>
          <li><button data-size="L">L</button></li>
          <li><button data-size="XL">XL</button></li>
          <li><button data-size="XXL">XXL</button></li>
        </ul>
      </div>
      <p class="color-text">색상</p>
      <div class="color" id="product-colors">
        <button class="red"><a th:href="@{/}"></a></button>
        <button class="blue"><a th:href="@{/}"></a></button>
        <button class="Black"><a th:href="@{/}"></a></button>
      </div>
      <div class="Buy-Cart">
        <button class="Buy">장바구니</button>
        <button class="Cart">구매</button>
      </div>
      <!-- 오른쪽의 추천 썸네일 및 스크롤 영역 제거 -->
    </div>
  </div>
</div>
<!-- 하단 추가 정보는 정보 탭으로 이동했으므로 하단 섹션 제거 -->
<script th:src="@{/user/js/production/detail.js}"></script>
<script th:src="@{/user/js/common.js}"></script>
</div>

</html>
