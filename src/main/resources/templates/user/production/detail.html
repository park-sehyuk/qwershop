<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultreq.net.nz/thymleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
  <link rel="stylesheet" th:href="@{/user/css/base.css}">
  <link rel="stylesheet" th:href="@{/user/css/production/detail.css}">
</head>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        $(document).ready(function(){
            calculateToalPrice();

            // 수량이 변경될 때마다 총 금액 계산
            $("#count").on("input change", function(){
                calculateToalPrice();
            });
        });

        function calculateToalPrice(){
            var count = $("#count").val();
            var price = $("#price").val();
            var totalPrice = price * count;
            // 천단위 콤마 추가해서 출력
            $("#totalPrice").html(totalPrice.toLocaleString() + '원');
        }

        /**
         * 1. 공통 요청 함수 (장바구니 전용)
         * 로그아웃 상태에서 401 에러 발생 시 알림창 후 로그인 페이지로 이동합니다.
         */
        async function sendRequest(url, paramData, successMsg) {
            if(!paramData.color) { alert("색상을 선택해주세요."); $("#colorSelect").focus(); return; }
            if(!paramData.size){ alert("사이즈를 선택해주세요."); $("#sizeSelect").focus(); return; }

            var token = $("meta[name='_csrf']").attr("content");
            var header = $("meta[name='_csrf_header']").attr("content");

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest', // ⭐ AJAX 요청임을 서버에 알림
                        [header]: token
                    },
                    body: JSON.stringify(paramData),
                    cache: 'no-cache'
                });

                // ⭐ 로그아웃 상태 처리 (CustomAuthenticationEntryPoint 연동)
                if (response.status === 401) {
                    alert('로그인이 필요한 서비스입니다.');
                    location.href = '/user/login';
                    return;
                }

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText);
                }

                alert(successMsg);
                location.href = "/cart";

            } catch (error) {
                alert("실패: " + error.message);
            }
        }

        // 주문하기
        // function order() {
        //     var paramData = {
        //         itemId: $("#itemId").val(),
        //         count: $("#count").val(),
        //         color: $("#colorSelect").val(), // 색상 추가
        //         size: $("#sizeSelect").val()
        //     };
        //     sendRequest("/order", paramData, "주문이 완료되었습니다.");
        // }
        function order() {
            console.log("주문하기 버튼 클릭됨"); // 디버깅용

            // 1. 초기화
            if (!window.IMP) {
                alert("결제 라이브러리가 로드되지 않았습니다.");
                return;
            }

            const IMP = window.IMP;
            IMP.init("imp45123642"); // 포트원 공용 테스트 식별코드

            // 2. 데이터 수집
            const itemName = $(".product-title").text();
            const price = parseInt($("#price").val());
            const count = parseInt($("#count").val());
            const color = $("#colorSelect").val();
            const size = $("#sizeSelect").val();

            if(!color || !size) {
                alert("옵션을 선택해주세요.");
                return;
            }

            // 3. 결제창 호출
            IMP.request_pay({
                pg: "kakaopay.TC0ONETIME", // 카카오페이 테스트용 (가장 잘 뜹니다)
                pay_method: "card",
                merchant_uid: "ORD_" + new Date().getTime(),
                name: $(".product-title").text(),
                amount: parseInt($("#price").val()) * parseInt($("#count").val()),
                buyer_name: "테스터",
                buyer_tel: "010-1234-5678"
            }, function (rsp) {
                if (rsp.success) {
                    alert("결제 성공!");
                    // 여기서 서버로 데이터를 보내 DB에 저장하는 로직을 실행합니다.
                } else {
                    alert("결제 실패: " + rsp.error_msg);
                }
            });
        }

        // 장바구니 담기
        function addCart() {
            var paramData = {
                itemId: $("#itemId").val(),
                count: $("#count").val(),
                color: $("#colorSelect").val() ,// 색상 추가
                size: $("#sizeSelect").val() // 사이즈 추가
            };
            sendRequest("/cart", paramData, "장바구니에 추가되었습니다.");
        }

    </script>
</th:block>



<div id="detail" layout:fragment="content">
  <div id="big-Title">
    <div class="top-Side">
      <div class="left-column">
        <div class="left-image" id="main-product-image">
          <img th:src="${item.itemUrl}" th:alt="${item.itemName}" style="width:100%; height:100%; object-fit:cover;">
        </div>

        <div class="left-tabs">
          <div class="tabs">
            <button class="tab active" data-tab="info">정보</button>
            <button class="tab" data-tab="size">사이즈</button>
            <button class="tab" data-tab="recommend">추천</button>
            <button class="tab" data-tab="review">후기</button>
          </div>
          <div class="tab-panels">
            <div class="tab-panel active" id="info">
              <div class="info-accordion">
                <div class="acc-item">
                  <button class="acc-head open">상품상세</button>
                  <div class="acc-body open">
<!--                    <p th:utext="">상세 설명</p>-->
                    <ul>
                      <li><strong>브랜드:</strong> <span th:text="${item.itemBrand}">브랜드</span></li>
                      <li><strong>가격:</strong> <span th:text="${item.itemPrice} + '원'">0원</span></li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
            <div class="tab-panel" id="size">
              <table class="size-table">
              </table>
            </div>
          </div>
        </div>
      </div>

        <div class="right-Side">
            <input type="hidden" id="itemId" th:value="${item.itemId}">
            <input type="hidden" id="price" th:value="${item.itemPrice}">

            <div class="product-header" style="margin-bottom: 20px; border-bottom: 1px solid #f4f4f4; padding-bottom: 15px;">
                <p class="brand-name"
                   th:text="${item.itemBrand}"
                   style="font-size: 14px; color: #888; font-weight: 600; text-decoration: underline; margin-bottom: 4px;">
                    브랜드명
                </p>
                <h2 class="product-title"
                    th:text="${item.itemName}"
                    style="font-size: 22px; font-weight: 700; color: #222; margin: 0; line-height: 1.4;">
                    상품 이름
                </h2>
            </div>

            <p class="price" style="font-size: 24px; font-weight: 800; color: #333; margin-bottom: 20px;">
                <span th:text="${#numbers.formatInteger(item.itemPrice, 0, 'COMMA')}">0</span>원
            </p>

            <div class="quantity-select">
                <label style="font-weight: bold; font-size: 14px;">수량 : </label>
                <input type="number" id="count" name="count" value="1" min="1"
                       style="width: 60px; padding: 5px; border: 1px solid #ddd; border-radius: 4px;">
            </div>

            <div class="color-select" style="margin-top: 20px;">
                <p style="font-weight: bold; margin-bottom: 8px;">색상 선택</p>
                <select id="colorSelect" name="color" class="color-dropdown" required
                        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="" disabled selected>색상을 선택해주세요</option>
                    <th:block th:each="color : ${colors}">
                        <option th:value="${color.codeName}" th:text="${color.codeName}"></option>
                    </th:block>
                </select>
            </div>

            <div class="size-select" style="margin-top: 20px; margin-bottom: 20px;">
                <p style="font-weight: bold; margin-bottom: 8px;">사이즈 선택</p>
                <select id="sizeSelect" name="size" class="size-dropdown" required
                        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="" disabled selected>사이즈를 선택해주세요</option>
                    <th:block th:each="size : ${sizes}">
                        <option th:value="${size.codeName}" th:text="${size.codeName}"></option>
                    </th:block>
                </select>
            </div>

            <div class="total-price-area" style="margin-bottom: 25px; padding: 15px; background: #f9f9f9; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
                <strong style="font-size: 16px;">총 결제 금액</strong>
                <span id="totalPrice" style="font-size: 22px; font-weight: 800; color: #f33;">0원</span>
            </div>

            <div class="Buy-Cart" style="display: flex; gap: 10px;">
                <button type="button" class="Buy" onclick="addCart()"
                        style="flex: 1; height: 50px; background: #fff; border: 1px solid #222; font-weight: bold; cursor: pointer;">
                    장바구니
                </button>
                <button type="button" class="Cart" onclick="order()"
                        style="flex: 1; height: 50px; background: #222; color: #fff; border: none; font-weight: bold; cursor: pointer;">
                    바로 구매
                </button>
            </div>
        </div>
      </div>
    </div>
  </div>
<!-- 하단 추가 정보는 정보 탭으로 이동했으므로 하단 섹션 제거 -->
<script th:src="@{/user/js/production/detail.js}"></script>
<script th:src="@{/user/js/common.js}"></script>
</div>

</html>
