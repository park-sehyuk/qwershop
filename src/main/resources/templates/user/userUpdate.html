<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" th:href="@{/user/css/base.css}" />
    <link rel="stylesheet" th:href="@{/user/css/userLog/signUp.css}" />
</head>

<div id="userUpdate" layout:fragment="content">
    <div class="form-container">
        <div class="form-wrapper">
            <h1 class="form-title">내 정보 수정</h1>
            <p class="form-subtitle">회원님의 소중한 정보를 안전하게 관리하세요.</p>

            <form th:action="@{/userUpdate}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="user-id">아이디</label>
                    <input type="text" id="user-id" name="id" th:value="${user.id}" readonly
                           style="border-bottom-style: dashed; color: #888; cursor: not-allowed;" />
                </div>

                <div class="form-group">
                    <label for="user-password">새 비밀번호</label>
                    <input type="password" id="user-password" name="pw" placeholder="변경할 경우에만 입력하세요" />
                </div>

                <div class="form-group">
                    <label for="user-name">이름</label>
                    <input type="text" id="user-name" name="name" th:value="${user.name}" required />
                </div>

                <div class="form-group">
                    <label for="user-phone">전화번호</label>
                    <input type="tel" id="user-phone" name="phone" th:value="${user.phone}" required />
                </div>

                <div class="form-group">
                    <label for="address">주소</label>
                    <div class="input-with-button">
                        <input type="text" id="address" name="address" th:value="${user.address}" readonly placeholder="주소 찾기를 이용해 주세요" />
                        <button type="button" class="btn btn-inline" onclick="execDaumPostcode()">주소 찾기</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="user-email">이메일 주소</label>
                    <input type="email" id="user-email" name="email" th:value="${user.email}"
                           style="width: 100%; padding: 12px 0; border: none; border-bottom: 1px solid #ccc;" required />
                </div>

                <div class="form-group">
                    <label>성별</label>
                    <div class="radio-group">
                        <p>
                            <input type="radio" name="gender" value="MALE" id="m" th:checked="${user.gender == 'MALE'}">
                            <label for="m" style="display: inline;">남성</label>
                        </p>
                        <p>
                            <input type="radio" name="gender" value="FEMALE" id="f" th:checked="${user.gender == 'FEMALE'}">
                            <label for="f" style="display: inline;">여성</label>
                        </p>
                    </div>
                </div>

                <div class="form-group">
                    <label for="user-birth">생년월일</label>
                    <input type="date" id="user-birth" name="birth"
                           th:value="${user.birth != null ? #dates.format(user.birth, 'yyyy-MM-dd') : ''}"
                           style="width: 100%; border: none; border-bottom: 1px solid #ccc; padding: 12px 0;" />
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">수정 완료</button>
                    <button type="button" class="btn btn-secondary" onclick="history.back()">취소</button>
                </div>
            </form>
        </div>
    </div>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script th:inline="javascript">
        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    document.getElementById('address').value = data.address;
                }
            }).open();
        }

        window.onload = function() {
            var errorMessage = [[${errorMessage}]];
            if (errorMessage) {
                alert(errorMessage);
            }
        };
    </script>
</div>
</html>
