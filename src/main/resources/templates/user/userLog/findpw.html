<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultreq.net.nz/thymleaf/layout"
      layout:decorate="~{layouts/layout}">
  <head>

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" th:href="@{/user/css/base.css}" />
    <link rel="stylesheet" th:href="@{/user/css/userLog/findpw.css}" />
  </head>
  <div id="findPw" layout:fragment="content">
    <div class="container">
      <div class="tabs">
        <div class="tab"><a th:href="@{/find}">아이디 찾기</a></div>
        <div class="tab active">비밀번호 찾기</div>
      </div>

      <div class="content-box">
        <p class="instruction">
          고객님의 아이디, 이름, 휴대 전화 번호를 입력해 주세요.
        </p>

        <div class="input-group">
          <label for="userId">아이디</label>
          <input type="text" id="userId" placeholder="" />
        </div>

        <div class="input-group">
          <label for="userName">이름</label>
          <input type="text" id="userName" placeholder="" />
        </div>

        <div class="input-group">
          <label for="userPhone">휴대 전화 번호</label>
          <input type="text" id="userPhone" placeholder="" />
        </div>

        <div class="input-group">
          <label for="newPw">새로운 비밀번호</label>
          <input type="password" id="newPw" placeholder="새로운 비밀번호를 입력해주세요." />
        </div>
      </div>

      <button class="btn-confirm">확인</button>
    </div>
    <script th:src="@{/user/js/userLog/findpw.js}"></script>
  </div>
</html>
