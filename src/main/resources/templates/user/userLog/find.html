<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultreq.net.nz/thymleaf/layout"
      layout:decorate="~{layouts/layout}">
  <head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" th:href="@{/user/css/base.css}" />
    <link rel="stylesheet" th:href="@{/user/css/userLog/find.css}" />
  </head>
  <div id="find" layout:fragment="content">
    <div class="container">
      <div class="tabs">
        <div class="tab active">아이디 찾기</div>
        <div class="tab"><a th:href="@{/findpw}">비밀번호 찾기</a></div>
      </div>

      <div class="content-box">
        <p class="instruction">
          고객님의 이름과 휴대 전화 번호를 입력해 주세요.
        </p>

        <div class="input-group">
          <label for="userName">이름</label>
          <input type="text" id="userName" placeholder="" />
        </div>

        <div class="input-group">
          <label for="userPhone">휴대 전화 번호</label>
          <input type="text" id="userPhone" placeholder="" />
        </div>
      </div>

      <button class="btn-confirm">확인</button>
    </div>
    <script th:src="@{/user/js/userLog/find.js}"></script>
  </div>
</html>
