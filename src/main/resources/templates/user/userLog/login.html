<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultreq.net.nz/thymleaf/layout"
      layout:decorate="~{layouts/layout}">
  <head>
    <title>QWER</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" th:href="@{/user/css/base.css}" />
    <link rel="stylesheet" th:href="@{/user/css/userLog/login.css}" />
  </head>

  <div id="login" layout:fragment="content">
    <div class="login-container">
      <div class="form-wrapper">
        <h1 class="main-title">LOGIN</h1>

        <div class="tab-nav">
          <a th:href="@{#}" class="tab-item active" id="member-tab">회원</a>
          <a th:href="@{#}" class="tab-item" id="non-member-tab">비회원</a>
        </div>

        <div class="form-content">
          <form action="#" id="member-login-form">
            <div class="form-group">
              <label for="user-id">아이디</label>
              <input type="text" id="user-id" />
            </div>

            <div class="form-group">
              <label for="user-password">패스워드</label>
              <div class="password-input-wrapper">
                <input type="password" id="user-password" />
                <button
                  type="button"
                  class="toggle-password-btn"
                  id="toggle-password"
                >
                  <img
                    th:src="@{/user/imges/open-eyes.jpeg}"
                    id="toggle-eye-icon"
                    alt="눈"
                  />
                </button>
              </div>
            </div>

            <div class="options-group">
              <label class="checkbox-label">
                <input type="checkbox" class="save-id-check" />
                아이디 저장
              </label>
            </div>

            <button type="submit" class="btn btn-login">로그인</button>
          </form>
          <form action="#" id="non-member-order-form" class="hidden">
            <h2 class="sub-title">비회원 주문조회</h2>
            <div class="form-group">
              <label for="reservation-number">예약번호</label>
              <input type="text" id="reservation-number" />
            </div>
            <div class="form-group">
              <label for="customer-name">고객명</label>
              <input type="text" id="customer-name" />
            </div>
            <button type="submit" class="btn btn-order-inquiry">
              주문조회
            </button>
          </form>

          <div class="util-links">
            <a th:href="@{/user/userLog/find.html}">아이디 찾기</a>
            <span class="separator">|</span>
            <a th:href="@{/user/userLog/findpw.html}">비밀번호 찾기</a>
            <span class="separator">|</span>
            <a th:href="@{/user/userLog/signUp.html}">회원가입</a>
          </div>
        </div>
      </div>
    </div>
    <script th:src="@{/user/js/userLog/login.js}"></script>
    <script th:src="@{/user/js/common.js}"></script>
  </div>
</html>
